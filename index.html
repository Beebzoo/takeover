<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Takeover</title>
<meta name="description" content="Takeover: take over the football world. A RISK-style football quiz on a world map, where your armies are real footballers you sign by naming them. A BALL game.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,600;0,800;1,800;1,900&family=Lora:ital,wght@0,400;1,400;1,500&display=swap">
<link rel="stylesheet" href="css/takeover.css">
</head>
<body>
<div id="shell">
  <header class="band">
    <h1 class="title">TAKEOVER</h1>
    <div class="gbar"><span id="bar">World Tour · prototype</span></div>
    <div class="score" id="score"></div>
    <button class="rulesbtn" id="rulesBtn" aria-label="Open the rulebook">Rules</button>
  </header>
  <div id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="World map"></svg>
    <svg id="pmap" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    <div class="zoombar">
      <button class="zb" data-z="world">World</button>
      <button class="zb" data-z="europe">Europe</button>
      <button class="zb" data-z="in">+</button>
      <button class="zb" data-z="out">−</button>
      <button class="zb" id="snd" aria-pressed="true">Sound</button>
      <button class="zb" id="viewBtn" aria-label="Switch between the flat map and the globe">Globe</button>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div id="layer"></div>
  </div>
  <aside id="side" aria-label="The season">
    <section><p class="label">Managers</p><div id="mgrs"></div></section>
    <section class="feedbox"><p class="label">The season so far</p><ol id="feed"></ol></section>
  </aside>
  <div class="strip"><p id="hint"></p><span id="action"></span></div>
  <div id="tip" role="tooltip" hidden></div>
</div>
<!-- data (generated by tools/; plain scripts so the page also runs from the file system) -->
<script src="data/world.js"></script>
<script src="data/game.js"></script>
<script src="data/kits.js"></script>
<script src="data/globe.js"></script>
<!-- modules, then the game -->
<script src="js/pieces.js"></script>
<script src="js/penalty.js"></script>
<script src="js/xi-card.js"></script>
<script src="js/game.js"></script>
<!-- the detailed map for zoomed-in views: loaded last, the game swaps it in when you zoom -->
<script src="data/world-hi.js"></script>
</body>
</html>
